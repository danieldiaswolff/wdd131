<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Daniel Dias Wolff">
  <meta name="description"
    content="Formulário de avaliação de produto da disciplina WDD 131. Envie classificação, data de instalação e comentários.">
  <title>Avaliação de Produto – WDD 131</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="estilos/formulario.css">
  <script src="scripts/obterdatas.js" defer></script>
  <script src="scripts/formulario.js" defer></script>
</head>

<body>
  <header>
    <h1>Avaliação de Produto</h1>
  </header>

  <main>
    <p class="intro">
      Conte-nos o que achou do produto. Os campos marcados com
      <span class="obrigatorio">*</span> são obrigatórios.
    </p>

    <form method="get" action="review.html">
      <fieldset>
        <legend>Informações do Produto</legend>

        <div class="campo">
          <label for="produto">Nome do Produto <span class="obrigatorio">*</span></label>
          <select id="produto" name="produto" required>
            <option value="" disabled selected>Select a Product ...</option>
          </select>
        </div>

        <fieldset class="classificacao">
          <legend>Classificação Geral <span class="obrigatorio">*</span></legend>
          <div class="estrelas" role="radiogroup" aria-label="Classificação de 1 a 5 estrelas">
            <input type="radio" id="nota5" name="classificacao" value="5" required aria-label="5 estrelas">
            <label for="nota5"><span aria-hidden="true">★</span></label>

            <input type="radio" id="nota4" name="classificacao" value="4" required aria-label="4 estrelas">
            <label for="nota4"><span aria-hidden="true">★</span></label>

            <input type="radio" id="nota3" name="classificacao" value="3" required aria-label="3 estrelas">
            <label for="nota3"><span aria-hidden="true">★</span></label>

            <input type="radio" id="nota2" name="classificacao" value="2" required aria-label="2 estrelas">
            <label for="nota2"><span aria-hidden="true">★</span></label>

            <input type="radio" id="nota1" name="classificacao" value="1" required aria-label="1 estrela">
            <label for="nota1"><span aria-hidden="true">★</span></label>
          </div>
        </fieldset>

        <div class="campo">
          <label for="data-instalacao">Data de Instalação <span class="obrigatorio">*</span></label>
          <input type="date" id="data-instalacao" name="data-instalacao" required>
        </div>
      </fieldset>

      <fieldset>
        <legend>Recursos Úteis</legend>
        <p class="ajuda">Marque todos os que se aplicam.</p>

        <div class="opcao">
          <input type="checkbox" id="durabilidade" name="recurso" value="durabilidade">
          <label for="durabilidade">Durabilidade</label>
        </div>
        <div class="opcao">
          <input type="checkbox" id="facilidade" name="recurso" value="facilidade">
          <label for="facilidade">Facilidade de uso</label>
        </div>
        <div class="opcao">
          <input type="checkbox" id="desempenho" name="recurso" value="desempenho">
          <label for="desempenho">Desempenho</label>
        </div>
        <div class="opcao">
          <input type="checkbox" id="design" name="recurso" value="design">
          <label for="design">Design</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Sua Avaliação</legend>

        <div class="campo">
          <label for="avaliacao">Avaliação Escrita</label>
          <textarea id="avaliacao" name="avaliacao" rows="5"
            placeholder="Escreva sua opinião sobre o produto (opcional)."></textarea>
        </div>

        <div class="campo">
          <label for="usuario">Nome de Usuário</label>
          <input type="text" id="usuario" name="usuario" placeholder="Seu nome (opcional)" autocomplete="nickname">
        </div>
      </fieldset>

      <input type="submit" value="Enviar Avaliação">
    </form>
  </main>

  <footer>
    <p>©<span id="anoatual"></span> Daniel Dias Wolff • Brasil</p>
    <p id="ultimaModificacao"></p>
  </footer>
</body>

</html>
