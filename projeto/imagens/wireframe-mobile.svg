<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" role="img" aria-labelledby="wfMobileTitle">
  <title id="wfMobileTitle">Wireframe da página inicial em visualização móvel</title>
  <rect width="280" height="560" fill="#f0f4f2" stroke="#246b4e" stroke-width="2"/>
  <!-- Header -->
  <rect x="10" y="10" width="260" height="50" fill="#246b4e" rx="4"/>
  <text x="140" y="40" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12">Logo | Nav</text>
  <!-- Hero -->
  <rect x="10" y="70" width="260" height="120" fill="#c8ddd4" stroke="#246b4e" stroke-width="1"/>
  <text x="140" y="135" text-anchor="middle" fill="#246b4e" font-family="sans-serif" font-size="13">Imagem / Hero</text>
  <!-- Headline -->
  <rect x="20" y="205" width="240" height="18" fill="#9bb8ab" rx="2"/>
  <rect x="40" y="230" width="200" height="12" fill="#b8cdc3" rx="2"/>
  <!-- CTA -->
  <rect x="70" y="255" width="140" height="32" fill="#c9852a" rx="4"/>
  <text x="140" y="275" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">CTA</text>
  <!-- Destaques -->
  <rect x="10" y="305" width="260" height="14" fill="#9bb8ab" rx="2"/>
  <rect x="10" y="330" width="80" height="90" fill="#d5e6de" stroke="#246b4e" stroke-width="1"/>
  <rect x="100" y="330" width="80" height="90" fill="#d5e6de" stroke="#246b4e" stroke-width="1"/>
  <rect x="190" y="330" width="80" height="90" fill="#d5e6de" stroke="#246b4e" stroke-width="1"/>
  <text x="50" y="380" text-anchor="middle" fill="#246b4e" font-family="sans-serif" font-size="9">Card</text>
  <text x="140" y="380" text-anchor="middle" fill="#246b4e" font-family="sans-serif" font-size="9">Card</text>
  <text x="230" y="380" text-anchor="middle" fill="#246b4e" font-family="sans-serif" font-size="9">Card</text>
  <!-- Footer -->
  <rect x="10" y="440" width="260" height="100" fill="#246b4e" rx="4"/>
  <text x="140" y="495" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12">Rodapé</text>
</svg>
